name: CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build project
        run: npm run build
